<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Simuwire v1.7 – block diagram simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{
  --bg:#e8ecf1; --bar:#f5f7f9; --panel:#fbfcfd; --line:#c6ced8; --text:#1c2531; --muted:#5a6879;
  --canvas:#ffffff; --bfill:#ffffff; --bstroke:#1c2531; --wire:#1c2531;
  --sel:#0b6bcb; --selbg:rgba(11,107,203,.10); --err:#c4291c; --warn:#9a6200; --ok:#1e7a37;
  --run:#1e8a3c; --hover:#e1e8f0; --dlg:#ffffff; --input:#ffffff; --desc:#f1f4f7;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#191c21; --bar:#22262d; --panel:#1f2329; --line:#3a414b; --text:#e2e6eb; --muted:#9ba5b2;
    --canvas:#15181c; --bfill:#1e2228; --bstroke:#d3d9e0; --wire:#d3d9e0;
    --sel:#5aa8ff; --selbg:rgba(90,168,255,.14); --err:#ff6b5e; --warn:#f0b54a; --ok:#6fd08a;
    --run:#3fb763; --hover:#2b3038; --dlg:#22262d; --input:#181b20; --desc:#1a1d22;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#191c21; --bar:#22262d; --panel:#1f2329; --line:#3a414b; --text:#e2e6eb; --muted:#9ba5b2;
  --canvas:#15181c; --bfill:#1e2228; --bstroke:#d3d9e0; --wire:#d3d9e0;
  --sel:#5aa8ff; --selbg:rgba(90,168,255,.14); --err:#ff6b5e; --warn:#f0b54a; --ok:#6fd08a;
  --run:#3fb763; --hover:#2b3038; --dlg:#22262d; --input:#181b20; --desc:#1a1d22;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.4 "Source Sans 3","Segoe UI",Helvetica,Arial,sans-serif;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
#app{display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:minmax(0,1fr);height:100%;position:relative}

/* toolbar */
.toolbar{display:flex;align-items:center;gap:4px;padding:5px 8px;background:var(--bar);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{font-weight:700;font-size:15px;margin-right:10px;display:flex;align-items:center;gap:6px;letter-spacing:.01em}
.brand svg{width:20px;height:20px}
.ver{font-weight:600;font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:0 4px;line-height:16px}
.sep{width:1px;align-self:stretch;background:var(--line);margin:2px 6px}
.tb{display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 9px;border:1px solid transparent;border-radius:4px;background:none;cursor:pointer;white-space:nowrap}
.tb:hover{background:var(--hover);border-color:var(--line)}
.tb svg{width:16px;height:16px;flex:none}
.tb:focus-visible,.lib-item:focus-visible,.cat-head:focus-visible{outline:2px solid var(--sel);outline-offset:1px}
.tb.run{color:#fff;background:var(--run);border-color:var(--run);font-weight:600;padding:0 12px}
.tb.run:hover{filter:brightness(1.08);background:var(--run)}
.stop{display:inline-flex;align-items:center;gap:6px;color:var(--muted);margin-left:4px}
.stop input{width:62px;height:28px;padding:0 6px;border:1px solid var(--line);border-radius:3px;background:var(--input);text-align:right}
.spacer{flex:1}
.zoomlbl{min-width:44px;text-align:center;color:var(--muted);font-variant-numeric:tabular-nums}
.only-narrow{display:none}

/* main */
.main{display:grid;grid-template-columns:var(--libw,250px) 1fr;min-height:0;position:relative}
.library{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0;position:relative}
.lib-resize{position:absolute;top:0;bottom:0;right:-4px;width:8px;cursor:col-resize;z-index:5;touch-action:none}
.lib-resize::after{content:"";position:absolute;top:0;bottom:0;left:3px;width:2px;background:transparent;transition:background .12s}
.lib-resize:hover::after,.lib-resize.active::after,.lib-resize:focus-visible::after{background:var(--sel)}
.lib-resize:focus-visible{outline:none}
body.resizing{cursor:col-resize;user-select:none}
.lib-head{padding:8px;border-bottom:1px solid var(--line)}
.lib-head input{width:100%;height:30px;padding:0 8px;border:1px solid var(--line);border-radius:3px;background:var(--input)}
.tree{overflow:auto;padding:4px 0 12px;flex:1}
.cat-head{display:flex;align-items:center;gap:6px;width:100%;padding:3px 8px;border:none;background:none;cursor:pointer;text-align:left;font-size:14.5px}
.cat-head:hover{background:var(--hover)}
.cat-head .chev{width:0;height:0;border-left:6px solid var(--text);border-top:5px solid transparent;border-bottom:5px solid transparent;transition:transform .12s}
.cat.open>.cat-head .chev{transform:rotate(90deg)}
.cat-items{display:none;padding:2px 0 6px}
.cat.open>.cat-items{display:block}
.root-head{font-weight:600}
.lib-item{display:flex;align-items:center;gap:8px;padding:3px 8px 3px 30px;cursor:grab;user-select:none;touch-action:none;border:none;background:none;width:100%;text-align:left}
.lib-item:hover{background:var(--hover)}
.lib-item svg{width:38px;height:28px;flex:none;overflow:visible}
.lib-note{padding:10px 12px;color:var(--muted);font-size:13px;border-top:1px solid var(--line)}

.canvas-wrap{position:relative;min-width:0;min-height:0;background:var(--canvas);overflow:hidden}
#canvas{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
#canvas.panning{cursor:grabbing}
.empty[hidden]{display:none}
.empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.empty div{max-width:340px;text-align:center;color:var(--muted);pointer-events:auto}
.empty p{margin:0 0 10px}
.empty .tb{border-color:var(--line);margin:0 3px}

/* svg blocks */
.bshape{fill:var(--bfill);stroke:var(--bstroke);stroke-width:1.2}
.blk{cursor:move}
.blk.sel .bshape{stroke:var(--sel);stroke-width:2.2}
.blk.err .bshape{stroke:var(--err);stroke-width:2.4}
.blk.unknown .bshape{stroke-dasharray:4 3;fill:var(--desc)}
.bicon{fill:none;stroke:var(--bstroke);stroke-width:1.2;stroke-linejoin:round}
.btext{fill:var(--bstroke);font-size:12px;text-anchor:middle;dominant-baseline:central}
.bsmall{fill:var(--bstroke);font-size:10px;text-anchor:middle;dominant-baseline:central}
.bname{fill:var(--text);font-size:11.5px;text-anchor:middle}
.blk.sel .bname{fill:var(--sel)}
.port{fill:none;stroke:var(--bstroke);stroke-width:1.2}
.phit{fill:transparent;cursor:crosshair}
.rh{fill:var(--canvas);stroke:var(--sel);stroke-width:1.4}
.rh-nw,.rh-se{cursor:nwse-resize}.rh-ne,.rh-sw{cursor:nesw-resize}
.blk:hover .phit{fill:var(--selbg);stroke:var(--sel);stroke-width:.8;stroke-opacity:.5}
.blk .phit:hover{fill:var(--selbg);stroke:var(--sel);stroke-width:1.4;stroke-opacity:1}
.tb[hidden]{display:none}
.phit.cand{fill:var(--selbg);stroke:var(--sel)}
.wire{fill:none;stroke:var(--wire);stroke-width:1.25}
.wire.sel{stroke:var(--sel);stroke-width:2.2}
.whit{fill:none;stroke:transparent;stroke-width:11;cursor:pointer}
.whit.sh{cursor:ns-resize}.whit.sv{cursor:ew-resize}
.wtemp{fill:none;stroke:var(--sel);stroke-width:1.4;stroke-dasharray:5 4}
.arr{fill:var(--wire)} .arrsel{fill:var(--sel)}
.bdot{fill:var(--wire)}

/* status */
.status{display:flex;align-items:center;gap:12px;padding:4px 10px;background:var(--bar);border-top:1px solid var(--line);font-size:13px;min-height:28px}
#msg{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#msg.err{color:var(--err)} #msg.warn{color:var(--warn)} #msg.ok{color:var(--ok)}
#solverInfo{color:var(--muted);white-space:nowrap}

/* dialogs */
.dlg-back{position:absolute;inset:0;background:rgba(10,14,20,.35);display:flex;align-items:center;justify-content:center;z-index:50;padding:12px}
.dlg{background:var(--dlg);border:1px solid var(--line);border-radius:6px;box-shadow:0 18px 50px rgba(0,0,0,.3);width:min(440px,100%);max-height:100%;display:flex;flex-direction:column}
.dlg-title{padding:9px 14px;border-bottom:1px solid var(--line);font-weight:600}
.dlg-body{padding:12px 14px;overflow:auto}
.desc{border:1px solid var(--line);background:var(--desc);border-radius:4px;padding:6px 10px 8px;margin:0 0 12px}
.desc legend{padding:0 4px;font-weight:600;font-size:13px}
.desc p{margin:0;font-size:13.5px;color:var(--muted)}
.fld{display:block;margin:0 0 10px}
.fld span{display:block;font-size:13px;margin-bottom:3px}
.fld input,.fld select,.fld textarea{width:100%;padding:5px 8px;border:1px solid var(--line);border-radius:3px;background:var(--input)}
.fld textarea{min-height:110px;font-family:Consolas,"Cascadia Mono",Menlo,monospace;font-size:13px;resize:vertical}
.fld .ferr{color:var(--err);font-size:12.5px;margin-top:3px;display:block;min-height:0}
.hint{font-size:12.5px;color:var(--muted);margin:-4px 0 10px}
.dlg-actions{display:flex;justify-content:flex-end;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}
.btn{height:30px;padding:0 14px;border:1px solid var(--line);border-radius:4px;background:var(--bar);cursor:pointer}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--sel);border-color:var(--sel);color:#fff}
.btn:focus-visible{outline:2px solid var(--sel);outline-offset:1px}
.keys{border-collapse:collapse;width:100%;font-size:13.5px}
.keys td{padding:4px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.keys td:first-child{white-space:nowrap;font-weight:600}

/* scope */
.scope{position:absolute;z-index:30;width:min(460px,94vw);height:290px;min-width:260px;min-height:200px;resize:both;overflow:hidden;
  background:#ffffff;border:1px solid #9a9a9a;border-radius:5px;box-shadow:0 10px 30px rgba(0,0,0,.25);display:grid;grid-template-rows:auto 1fr auto;color:#111111}
.scope header{display:flex;align-items:center;gap:6px;padding:5px 6px 5px 10px;background:#ececec;border-bottom:1px solid #c8c8c8;cursor:move;touch-action:none;user-select:none}
.scope header b{flex:1;font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scope header button{height:24px;min-width:26px;border:1px solid #b5b5b5;background:#ffffff;border-radius:3px;color:#111111;cursor:pointer;font-size:12.5px;padding:0 7px}
.scope header button:hover{background:#f3f3f3}
.scope canvas{width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
.scope canvas.pan{cursor:grabbing}
.scope footer{padding:3px 10px;font-size:12.5px;color:#333333;background:#f6f6f6;border-top:1px solid #dddddd;min-height:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}

.ghost{position:fixed;z-index:60;pointer-events:none;opacity:.85}
.menu{position:absolute;z-index:45;background:var(--dlg);border:1px solid var(--line);border-radius:6px;box-shadow:0 12px 36px rgba(0,0,0,.22);width:min(360px,92vw);max-height:min(72vh,560px);overflow:auto;padding:4px 0}
.menu-group{padding:8px 12px 3px;font-size:12.5px;font-weight:600;color:var(--muted)}
.menu-item{display:block;width:100%;text-align:left;border:none;background:none;padding:6px 12px;cursor:pointer}
.menu-item b{display:block;font-weight:600;font-size:14px}
.menu-item span{display:block;font-size:12.5px;color:var(--muted);line-height:1.35}
.menu-item:hover,.menu-item:focus-visible{background:var(--hover);outline:none}
.tb .caret{width:9px;height:9px;margin-left:-1px}
.ghost svg{width:60px;height:44px;overflow:visible}

@media (max-width:760px){
  .main{grid-template-columns:1fr}
  .lib-resize{display:none}
  .library{position:absolute;z-index:20;top:0;bottom:0;left:0;width:min(290px,86vw);box-shadow:6px 0 24px rgba(0,0,0,.25);transform:translateX(-102%);transition:transform .18s}
  .library.show{transform:none}
  .only-narrow{display:inline-flex}
  .lbl{display:none}
  .brand span,.brand .ver{display:none}
  #solverInfo{display:none}
  .toolbar{gap:2px}
  .tb{padding:0 7px}
}
@media (prefers-reduced-motion: reduce){ .library,.cat-head .chev{transition:none} }
</style>
</head>
<body>
<div id="app">
  <header class="toolbar">
    <div class="brand" aria-label="Simuwire v1.7">
      <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="1.5" y="5" width="7" height="10" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8.5 10h4" stroke="currentColor" stroke-width="1.5"/><path d="M12 7.5l2.5 2.5-2.5 2.5z" fill="currentColor"/><rect x="14.5" y="5" width="4" height="10" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
      <span>Simuwire</span><small class="ver">v1.7</small>
    </div>
    <button class="tb only-narrow" id="btnLib" title="Block library"><svg viewBox="0 0 16 16"><path d="M2 4h12M2 8h12M2 12h12" stroke="currentColor" stroke-width="1.6"/></svg></button>
    <button class="tb" id="btnNew" title="New model"><svg viewBox="0 0 16 16"><path d="M3.5 1.5h6l3 3v10h-9z" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M9.5 1.5v3h3" fill="none" stroke="currentColor" stroke-width="1.3"/></svg><span class="lbl">New</span></button>
    <button class="tb" id="btnOpen" title="Open a Simuwire model (.json) or a Simulink model (.slx, .mdl)"><svg viewBox="0 0 16 16"><path d="M1.5 3.5h5l1.5 1.5h6.5v8.5h-13z" fill="none" stroke="currentColor" stroke-width="1.3"/></svg><span class="lbl">Open</span></button>
    <button class="tb" id="btnSave" title="Save the model to a file (Ctrl+S)" hidden><svg viewBox="0 0 16 16"><path d="M2.5 2.5h9l2 2v9h-11z" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M5 2.5v3.5h5V2.5M5 13.5v-4h6v4" fill="none" stroke="currentColor" stroke-width="1.3"/></svg><span class="lbl">Save</span></button>
    <button class="tb" id="btnExample" title="Example models" aria-haspopup="menu" aria-expanded="false"><svg viewBox="0 0 16 16"><path d="M1.5 13.5c3 0 3-9 6.5-9s3.5 6 6.5 6" fill="none" stroke="currentColor" stroke-width="1.4"/></svg><span class="lbl">Examples</span><svg class="caret" viewBox="0 0 10 10"><path d="M1.5 3.5l3.5 3.5 3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></button>
    <button class="tb" id="btnUndo" title="Undo (Ctrl+Z)"><svg viewBox="0 0 16 16"><path d="M5 3L2 6l3 3" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M2.5 6h7a4 4 0 010 8H6" fill="none" stroke="currentColor" stroke-width="1.4"/></svg><span class="lbl">Undo</span></button>
    <div class="sep"></div>
    <button class="tb run" id="btnRun" title="Run simulation (Ctrl+T)"><svg viewBox="0 0 16 16"><path d="M4 2.5l9 5.5-9 5.5z" fill="currentColor"/></svg>Run</button>
    <label class="stop" title="Simulation stop time (s)"><span class="lbl">Stop time</span><input id="stopTime" value="10" inputmode="decimal" aria-label="Stop time"></label>
    <button class="tb" id="btnSettings" title="Model settings and variables"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.4" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M8 1v2.2M8 12.8V15M1 8h2.2M12.8 8H15M3 3l1.6 1.6M11.4 11.4L13 13M13 3l-1.6 1.6M4.6 11.4L3 13" stroke="currentColor" stroke-width="1.3"/></svg><span class="lbl">Settings</span></button>
    <div class="spacer"></div>
    <button class="tb" id="btnZoomOut" title="Zoom out"><svg viewBox="0 0 16 16"><path d="M3 8h10" stroke="currentColor" stroke-width="1.6"/></svg></button>
    <span class="zoomlbl" id="zoomLbl">100%</span>
    <button class="tb" id="btnZoomIn" title="Zoom in"><svg viewBox="0 0 16 16"><path d="M3 8h10M8 3v10" stroke="currentColor" stroke-width="1.6"/></svg></button>
    <button class="tb" id="btnFit" title="Fit model to view (Space)"><svg viewBox="0 0 16 16"><path d="M1.5 5V1.5H5M11 1.5h3.5V5M14.5 11v3.5H11M5 14.5H1.5V11" fill="none" stroke="currentColor" stroke-width="1.4"/></svg><span class="lbl">Fit</span></button>
    <button class="tb" id="btnHelp" title="Help and about"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M6 6.2a2 2 0 113 1.7c-.7.4-1 .8-1 1.6M8 11.3v.4" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></button>
    <input type="file" id="fileIn" accept=".slx,.mdl,.json" hidden>
  </header>

  <div class="main">
    <aside class="library" id="library" aria-label="Block library">
      <div class="lib-head"><input id="libSearch" placeholder="Search blocks" aria-label="Search blocks"></div>
      <div class="tree" id="tree"></div>
      <div class="lib-note">Drag blocks onto the canvas, or click one to add it.</div>
      <div class="lib-resize" id="libResize" role="separator" aria-orientation="vertical" aria-label="Resize block library" tabindex="0" title="Drag to resize. Double-click to reset."></div>
    </aside>
    <div class="canvas-wrap" id="wrap">
      <svg id="canvas" aria-label="Model canvas">
        <defs>
          <marker id="arr" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="arr" d="M0,1 L10,5 L0,9 z"/></marker>
          <marker id="arrsel" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="arrsel" d="M0,1 L10,5 L0,9 z"/></marker>
        </defs>
        <g id="world"><g id="wires"></g><g id="blocks"></g><g id="temp"></g></g>
      </svg>
      <div class="empty" id="empty" hidden>
        <div>
          <p>This model is empty. Drag a block from the library, or open a saved model or an .slx file.</p>
          <button class="tb" data-act="open">Open a file</button><button class="tb" data-act="example">Load an example</button>
        </div>
      </div>
    </div>
  </div>

  <footer class="status">
    <span id="msg">Ready</span>
    <span id="solverInfo"></span>
  </footer>
</div>

<script>
'use strict';
/* =====================================================================
   1) Expression evaluator (MATLAB-like: 0.5*K, [T 1], sin(u), u(1))
   ===================================================================== */
const FUNCS={sin:Math.sin,cos:Math.cos,tan:Math.tan,asin:Math.asin,acos:Math.acos,atan:Math.atan,atan2:Math.atan2,
  exp:Math.exp,log:Math.log,log10:Math.log10,sqrt:Math.sqrt,abs:Math.abs,sign:Math.sign,floor:Math.floor,ceil:Math.ceil,
  round:Math.round,min:Math.min,max:Math.max,sinh:Math.sinh,cosh:Math.cosh,tanh:Math.tanh,pow:Math.pow,
  mod:(a,b)=>b===0?a:a-Math.floor(a/b)*b,rem:(a,b)=>a%b};
const CONSTS={pi:Math.PI,Inf:Infinity,inf:Infinity,eps:2.220446049250313e-16};

function tokenize(s){
  const toks=[];let i=0,sp=false;
  while(i<s.length){
    const c=s[i];
    if(/\s/.test(c)){sp=true;i++;continue;}
    const rest=s.slice(i);let m;
    if((m=/^(\d+\.?\d*|\.\d+)([eE][+-]?\d+)?/.exec(rest))){toks.push({k:'num',v:parseFloat(m[0]),sb:sp});i+=m[0].length;}
    else if((m=/^[A-Za-z_]\w*/.exec(rest))){toks.push({k:'id',v:m[0],sb:sp});i+=m[0].length;}
    else if((m=/^(\.\*|\.\/|\.\^|>=|<=|==|~=|!=)/.exec(rest))){toks.push({k:'op',v:m[0].replace(/^\./,''),sb:sp});i+=m[0].length;}
    else if('+-*/^()[],;<>'.includes(c)){toks.push({k:'op',v:c,sb:sp});i++;}
    else throw new Error(`unrecognized character “${c}”`);
    sp=false;
  }
  toks.push({k:'end',v:'',sb:sp});
  return toks;
}
function parseExpr(src){
  const T=tokenize(String(src));let p=0,inBr=0;
  const isOp=v=>T[p].k==='op'&&T[p].v===v;
  const expect=v=>{if(!isOp(v))throw new Error(`expected “${v}”`);p++;};
  const CMP=['<','>','<=','>=','==','~=','!='];
  function cmp(){let a=add();while(T[p].k==='op'&&CMP.includes(T[p].v)){const op=T[p++].v;a={n:'bin',op,a,b:add()};}return a;}
  function add(){let a=mul();
    while(T[p].k==='op'&&(T[p].v==='+'||T[p].v==='-')){
      if(inBr&&T[p].sb&&!T[p+1].sb)break;

function scalar(v){if(Array.isArray(v)){if(v.length===1)return v[0];throw new Error('expected a single number, got a vector');}return v;}
function evalAst(n,env){

      switch(n.op){case '+':return a+b;case '-':return a-b;case '*':return a*b;case '/':return a/b;case '^':return Math.pow(a,b);

function parseWorkspace(text){
  const env={};
  // strip comments line by line first, so a ';' inside a comment does not split the line
  const stmts=String(text||'').split('\n').flatMap(l=>l.replace(/%.*$/,'').split(';'));
  for(const raw of stmts){
    const line=raw.trim();if(!line)continue;
    const m=/^([A-Za-z_]\w*)\s*=\s*(.+)$/.exec(line);
    if(!m)throw new Error(`Can’t read variable line “${line}”. Use the form K = 2`);
    try{env[m[1]]=evalAst(parseExpr(m[2]),env);}catch(e){throw new Error(`Variable ${m[1]}: ${e.message}`);}

}
function astText(n){

    case 'bin':return astText(n.a)+n.op+astText(n.b);
    case 'call':return n.f+'('+n.args.map(astText).join(',')+')';

const SUP={0:'⁰',1:'¹',2:'²',3:'³',4:'⁴',5:'⁵',6:'⁶',7:'⁷',8:'⁸',9:'⁹'};
function polyText(str){
  const s=String(str).trim();
  const inner=s.startsWith('[')&&s.endsWith(']')?s.slice(1,-1):s;
  let items;
  try{items=parseExpr('['+inner+']').items;}catch(e){return s;}
  const n=items.length,terms=[];
  items.forEach((it,i)=>{
    const pw=n-1-i;let c=astText(it);if(c==='0')return;
    const sv=pw===0?'':pw===1?'s':'s'+String(pw).split('').map(d=>SUP[d]).join('');
    const paren=it.n==='bin';
    let t;
    if(pw===0)t=c;else if(c==='1')t=sv;else if(c==='-1')t='-'+sv;else t=(paren?`(${c})`:c)+sv;
    terms.push(t);
  });
  if(!terms.length)return '0';
  return terms.join('+').replace(/\+-/g,'−');
}

function frac(w,h,a,b){
  a=fit(a,w);b=fit(b,w);const cx=w/2,cy=h/2;
  const lw=Math.min(w-8,Math.max(a.length,b.length)*6.8+6);
  return TX(cx,cy-8,a)+`<line x1="${cx-lw/2}" y1="${cy}" x2="${cx+lw/2}" y2="${cy}" class="bicon"/>`+TX(cx,cy+9,b);

  if(/^\d+$/.test(s))return '+'.repeat(Math.max(1,Math.min(8,+s))).split('');
  const r=s.split('').filter(c=>c==='+'||c==='-');

}
function prodOps(str){
  const s=String(str??'').trim();
  if(/^\d+$/.test(s))return '*'.repeat(Math.max(1,Math.min(8,+s))).split('');
  const r=s.split('').filter(c=>c==='*'||c==='/');

/* =====================================================================
   3) Simulation engine (fixed-step ode4 / ode1)
   ===================================================================== */
class SimError extends Error{constructor(msg,ids){super(msg);this.ids=ids||[];}}
const nInOf=b=>BLOCKS[b.type].nIn(b),nOutOf=b=>BLOCKS[b.type].nOut(b);
function fieldLabel(type,k){const f=(BLOCKS[type].fields||[]).find(f=>f.k===k);return f?f.l:k;}
function evalParam(str,ws){return evalAst(parseExpr(String(str)),ws);}

function simulate(model){
  const t0=performance.now();
  let ws;try{ws=parseWorkspace(model.settings.ws);}catch(e){throw new SimError(e.message+' (Settings → variables)');}
  let stop;try{stop=scalar(evalParam(model.settings.stop,ws));}catch(e){throw new SimError('Stop time: '+e.message);}
  if(!(stop>0)||!isFinite(stop))throw new SimError('Stop time must be a positive number.');
  if(!model.blocks.length)throw new SimError('The model is empty. Add some blocks first.');
  const idx=new Map(model.blocks.map((b,i)=>[b.id,i]));
  const S=model.blocks.map((b,i)=>({b,p:b.p,def:BLOCKS[b.type],i,ins:new Array(nInOf(b)).fill(-1),nx:0,xo:0,x0:[]}));
  for(const l of model.lines){const si=idx.get(l.src.b),di=idx.get(l.dst.b);if(si==null||di==null)continue;if(l.dst.port<S[di].ins.length)S[di].ins[l.dst.port]=si;}
  const warns=[];
  for(const s of S)s.ins.forEach((v,k)=>{if(v<0)warns.push({id:s.b.id,msg:`input ${k+1} of “${s.b.name}” is unconnected and was treated as 0`});});
  let minTs=Infinity,maxRate=0;
  for(const s of S){
    const E={ws,
      num:k=>{let v;try{v=scalar(evalParam(s.p[k],ws));}catch(e){throw new Error(`${fieldLabel(s.b.type,k)}: ${e.message}`);}if(!isFinite(v))throw new Error(`${fieldLabel(s.b.type,k)}: must be a finite number`);return v;},
      // limits may be inf or -inf
      limit:k=>{let v;try{v=scalar(evalParam(s.p[k],ws));}catch(e){throw new Error(`${fieldLabel(s.b.type,k)}: ${e.message}`);}if(Number.isNaN(v))throw new Error(`${fieldLabel(s.b.type,k)}: must be a number`);return v;},
      vec:k=>{let v;try{v=evalParam(s.p[k],ws);}catch(e){throw new Error(`${fieldLabel(s.b.type,k)}: ${e.message}`);}return Array.isArray(v)?v:[v];},
      ts:v=>{minTs=Math.min(minTs,v);},rate:r=>{if(isFinite(r))maxRate=Math.max(maxRate,r);}};
    try{s.def.init(s,E);}catch(e){throw new SimError(`“${s.b.name}”: ${e.message}`,[s.b.id]);}
    s.ft=typeof s.def.ft==='function'?s.def.ft(s):!!s.def.ft;
    s.u=new Float64Array(s.ins.length);
  }
  let h;
  const stepSetting=String(model.settings.step||'auto').trim();
  if(stepSetting==='auto'||stepSetting===''){
    h=stop/1000;if(maxRate>0)h=Math.min(h,0.5/maxRate);
    if(isFinite(minTs)){h=Math.min(h,minTs);h=minTs/Math.ceil(minTs/h-1e-9);}
  }else{
    try{h=scalar(evalParam(stepSetting,ws));}catch(e){throw new SimError('Step size: '+e.message);}
    if(!(h>0))throw new SimError('Step size must be positive.');
  }
  const N=Math.round(stop/h);
  if(N>400000)throw new SimError(`Too many steps (${N.toLocaleString('en-US')}). Shorten the stop time or increase the step size.`);
  for(const s of S)if(s.def.finalize)s.def.finalize(s,h);
  // execution order (direct-feedthrough blocks after their sources)
  const n=S.length,indeg=new Array(n).fill(0),outs=Array.from({length:n},()=>[]);
  for(const d of S)if(d.ft)for(const si of d.ins)if(si>=0){indeg[d.i]++;outs[si].push(d.i);}
  const order=[],q=[];for(let i=0;i<n;i++)if(!indeg[i])q.push(i);
  while(q.length){const i=q.shift();order.push(i);for(const j of outs[i])if(--indeg[j]===0)q.push(j);}
  if(order.length<n){const loop=S.filter(s=>indeg[s.i]>0);throw new SimError(`Algebraic loop: ${loop.map(s=>'“'+s.b.name+'”').join(', ')}. Add an Integrator, Unit Delay or Transport Delay to the loop.`,loop.map(s=>s.b.id));}
  let nx=0;for(const s of S){if(s.nx){s.xo=nx;nx+=s.nx;}}
  const X=new Float64Array(nx);for(const s of S)for(let k=0;k<s.nx;k++)X[s.xo+k]=s.x0[k]||0;
  const SX=S.filter(s=>s.nx>0),SM=S.filter(s=>s.def.major),SP=S.filter(s=>s.def.post);
  const Y=new Float64Array(n);
  const gather=s=>{const u=s.u;for(let k=0;k<s.ins.length;k++){const si=s.ins[k];u[k]=si>=0?Y[si]:0;}};
  const outputs=(t,Xc,major)=>{for(const i of order){const s=S[i];gather(s);if(s.def.out)Y[i]=s.def.out(s,t,s.u,Xc,major);}};
  const derivs=(t,Xc,dX)=>{outputs(t,Xc,false);for(const s of SX){gather(s);s.def.deriv(s,t,s.u,Xc,dX);}};
  const k1=new Float64Array(nx),k2=new Float64Array(nx),k3=new Float64Array(nx),k4=new Float64Array(nx),Xt=new Float64Array(nx);
  const ode1=model.settings.solver==='ode1';
  for(let k=0;k<=N;k++){
    const t=k===N?stop:k*h;
    outputs(t,X,true);
    for(let i=0;i<n;i++)if(!isFinite(Y[i])){const s=S[i];throw new SimError(`Numerical error: the output of “${s.b.name}” became infinite or undefined at t = ${fmtVal(t)} s. The system may be unstable, or the step size too large.`,[s.b.id]);}
    for(const s of SM){gather(s);s.def.major(s,t,s.u);}
    if(k===N)break;
    const hk=(k===N-1)?stop-t:h;
    if(nx){
      if(ode1){derivs(t,X,k1);for(let i=0;i<nx;i++)X[i]+=hk*k1[i];}
      else{
        derivs(t,X,k1);for(let i=0;i<nx;i++)Xt[i]=X[i]+hk/2*k1[i];
        derivs(t+hk/2,Xt,k2);for(let i=0;i<nx;i++)Xt[i]=X[i]+hk/2*k2[i];
        derivs(t+hk/2,Xt,k3);for(let i=0;i<nx;i++)Xt[i]=X[i]+hk*k3[i];
        derivs(t+hk,Xt,k4);for(let i=0;i<nx;i++)X[i]+=hk/6*(k1[i]+2*k2[i]+2*k3[i]+k4[i]);
      }
    }
    for(const s of SP)s.def.post(s);
  }
  const res={stop,h,N,ms:performance.now()-t0,scopes:{},displays:{},warns};
  for(const s of S){
    if(s.b.type==='Scope')res.scopes[s.b.id]={t:s.tt,ys:s.data,labels:s.ins.map((si,k)=>si>=0?S[si].b.name.replace(/\s+/g,' '):`u${k+1}`)};
    if(s.b.type==='Display')res.displays[s.b.id]=s.last;
  }
  return res;
}

const $=s=>document.querySelector(s);
const svg=$('#canvas'),world=$('#world'),LW=$('#wires'),LB=$('#blocks'),TMP=$('#temp');
// Round Sum: with a “|” in the sign list, slots are spread from top (90°) through left (180°) to bottom (270°),
// so “|+-” puts + on the left and − at the bottom.
function sumInputSlot(b,i){
  const s=String(b.p.Inputs??'').trim();
  const chars=/^\d+$/.test(s)?[]:s.split('').filter(c=>c==='+'||c==='-'||c==='|').slice(0,12);
  if(!chars.includes('|')||chars.length<2)return null;
  const idx=[];chars.forEach((c,k)=>{if(c!=='|')idx.push(k);});
  if(i>=idx.length)return null;
  const th=(90+180*idx[i]/(chars.length-1))*Math.PI/180;
  const r=b.w/2,c=Math.cos(th)*(b.flip?-1:1),sn=Math.sin(th);
  const x=r+r*c,y=b.h/2-r*sn;
  if(Math.abs(c)>=Math.abs(sn)-1e-9)return{x,y,dir:c<0?-1:1,v:0};
  return{x,y,dir:0,v:sn>0?-1:1};
}
function portLocal(b,kind,i){
  if(b.type==='Sum'&&kind==='in'){const sl=sumInputSlot(b,i);if(sl)return sl;}
  const n=kind==='in'?nInOf(b):nOutOf(b);
  const left=(kind==='in')!==!!b.flip;
  const y=b.h*(i+1)/(n+1);let x=left?0:b.w;
  if(b.type==='Sum'){const r=b.w/2,dy=y-b.h/2,dx=Math.sqrt(Math.max(0,r*r-dy*dy));x=left?r-dx:r+dx;}
  if(b.type==='Gain'&&kind==='out')x=left?0:b.w;
  return{x,y,dir:left?-1:1,v:0};
}
function portPos(b,kind,i){const p=portLocal(b,kind,i);return{x:b.x+p.x,y:b.y+p.y,dir:p.dir,v:p.v||0};}
function route(a,bp,sb,db){
  if(bp.v){
    const G=14,ey=bp.y+bp.v*G;
    if((a.y-ey)*bp.v>=0&&(bp.x-a.x)*a.dir>=G)return[[a.x,a.y],[bp.x,a.y],[bp.x,bp.y]];
    const sx=a.x+a.dir*G;
    const ym=bp.v>0?Math.max(sb.y+sb.h,db.y+db.h,a.y)+26:Math.min(sb.y,db.y,a.y)-26;
    return[[a.x,a.y],[sx,a.y],[sx,ym],[bp.x,ym],[bp.x,bp.y]];
  }
  const d1=a.dir,d2=-bp.dir,G=14;
  const sx=a.x+d1*G,ex=bp.x-d2*G;
  if(d1===d2){
    if((ex-sx)*d1>=0){
      if(Math.abs(a.y-bp.y)<.5)return[[a.x,a.y],[bp.x,bp.y]];
      const mx=Math.round((a.x+bp.x)/2);
      return[[a.x,a.y],[mx,a.y],[mx,bp.y],[bp.x,bp.y]];
    }
    let ym;const sB=sb.y+sb.h,dB=db.y+db.h;
    if(db.y>sB+24)ym=(sB+db.y)/2;else if(sb.y>dB+24)ym=(dB+sb.y)/2;else ym=Math.max(sB,dB)+26;
    return[[a.x,a.y],[sx,a.y],[sx,ym],[ex,ym],[ex,bp.y],[bp.x,bp.y]];
  }
  const xc=d1===1?Math.max(sx,ex):Math.min(sx,ex);
  return[[a.x,a.y],[xc,a.y],[xc,bp.y],[bp.x,bp.y]];
}
function linePoints(l){
  const sb=getB(l.src.b),db=getB(l.dst.b);if(!sb||!db)return null;
  if(l.src.port>=nOutOf(sb)||l.dst.port>=nInOf(db))return null;
  const a=portPos(sb,'out',l.src.port),b=portPos(db,'in',l.dst.port);
  // A hand-routed line keeps its inner corners; the segments touching the ports follow the blocks.
  if(Array.isArray(l.pts)&&l.pts.length&&(b.v||l.pts.length>=2)){
    const P=[[a.x,a.y],...l.pts.map(p=>[p[0],p[1]]),[b.x,b.y]],n=P.length;
    P[1][1]=a.y;
    if(b.v)P[n-2][0]=b.x;else P[n-2][1]=b.y;
    return simplifyPts(P);
  }
  return route(a,b,sb,db);

function simplifyPts(P){
  const out=[P[0]];
  for(let i=1;i<P.length;i++)out.push(P[i]);
  let changed=true;
  while(changed){changed=false;
    for(let i=1;i<out.length-1;i++){const p=out[i-1],q=out[i],r=out[i+1];
      const same=Math.abs(p[0]-q[0])<.5&&Math.abs(p[1]-q[1])<.5;
      const colX=Math.abs(p[0]-q[0])<.5&&Math.abs(q[0]-r[0])<.5,colY=Math.abs(p[1]-q[1])<.5&&Math.abs(q[1]-r[1])<.5;
      if(same||colX||colY){out.splice(i,1);changed=true;break;}}}
  return out;
}
// Move segment i of polyline P0 to coordinate val (x for a vertical segment, y for a horizontal one).
// Segments touching a port get a short stub so the port end stays put.
function moveSegment(P0,i,val,a,b){
  const P=P0.map(p=>p.slice());
  const p0=P0[i],p1=P0[i+1],vert=Math.abs(p0[0]-p1[0])<.5;
  const G=14;
  if(i===P.length-2){const e=b.v?[b.x,b.y+b.v*G]:[b.x+b.dir*G,b.y];P.splice(P.length-1,0,e.slice(),e.slice());}
  if(i===0){const s=[a.x+a.dir*G,a.y];P.splice(1,0,s.slice(),s.slice());i+=2;}
  if(vert){P[i][0]=val;P[i+1][0]=val;}else{P[i][1]=val;P[i+1][1]=val;}
  return simplifyPts(P);
}

function findPortAt(w,kind,excludeId){
  let best=null,bd=18/view.k;

    for(let i=0;i<n;i++){const p=portPos(b,kind,i);const d=Math.hypot(p.x-w.x,p.y-w.y);if(d<bd){bd=d;best={b:b.id,port:i};}}}
  if(best)return best;
  for(const b of model.blocks){if(b.id===excludeId)continue;
    if(w.x>=b.x&&w.x<=b.x+b.w&&w.y>=b.y&&w.y<=b.y+b.h){const n=kind==='in'?nInOf(b):nOutOf(b);if(!n)return null;

svg.addEventListener('pointermove',e=>{

  }
});
function highlightCand(c,kind){

function endDrag(e){
  if(!drag)return;
  const w=toWorld(e.clientX,e.clientY);const d=drag;drag=null;svg.classList.remove('panning');TMP.innerHTML='';

  if(d.mode==='move'){

svg.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.clientX,e.clientY,Math.exp(-e.deltaY*(e.ctrlKey?0.01:0.0015)));},{passive:false});
function zoomAt(cx,cy,f){
  const r=svg.getBoundingClientRect();const k=Math.min(4,Math.max(0.2,view.k*f));f=k/view.k;
  const px=cx-r.left,py=cy-r.top;view.x=px-(px-view.x)*f;view.y=py-(py-view.y)*f;view.k=k;applyView();
}
function zoomCenter(f){const r=svg.getBoundingClientRect();zoomAt(r.left+r.width/2,r.top+r.height/2,f);}
function fitView(){
  if(!model.blocks.length){view.x=40;view.y=40;view.k=1;applyView();return;}
  let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
  for(const b of model.blocks){x0=Math.min(x0,b.x);y0=Math.min(y0,b.y);x1=Math.max(x1,b.x+b.w);y1=Math.max(y1,b.y+b.h+18);}
  for(const l of model.lines){const p=linePoints(l);if(p)for(const q of p){x0=Math.min(x0,q[0]);x1=Math.max(x1,q[0]);y0=Math.min(y0,q[1]);y1=Math.max(y1,q[1]);}}

  const k=Math.min(1.3,Math.max(0.2,Math.min((r.width-2*pad)/(x1-x0||1),(r.height-2*pad)/(y1-y0||1))));

// While a block is dragged, snap it vertically so one of its connections becomes a straight line

function alignToNeighbours(d){
  const pb=getB(d.id);if(!pb)return;
  const tol=8/view.k;let best=null;
  for(const l of model.lines){
    let mine,other;
    if(l.src.b===pb.id&&!d.orig.has(l.dst.b)){const ob=getB(l.dst.b);if(!ob||l.dst.port>=nInOf(ob))continue;
      mine=portPos(pb,'out',l.src.port);other=portPos(ob,'in',l.dst.port);if(other.v)continue;}
    else if(l.dst.b===pb.id&&!d.orig.has(l.src.b)){const ob=getB(l.src.b);if(!ob||l.dst.port>=nInOf(pb))continue;
      mine=portPos(pb,'in',l.dst.port);if(mine.v)continue;other=portPos(ob,'out',l.src.port);}
    else continue;
    const dd=other.y-mine.y;
    if(Math.abs(dd)<=0.01)return;
    if(Math.abs(dd)<=tol&&(best===null||Math.abs(dd)<Math.abs(best)))best=dd;

function deleteSelection(){

  if(!sel.size)return;
  pushUndo();const n=sel.size;
  model.blocks=model.blocks.filter(b=>!sel.has(b.id));
  model.lines=model.lines.filter(l=>!sel.has(l.src.b)&&!sel.has(l.dst.b));
  for(const id of sel){const w=scopeWins.get(id);if(w)w.el.remove(),scopeWins.delete(id);}

}
function flipSelection(){if(!sel.size)return;pushUndo();for(const id of sel){const b=getB(id);if(b)b.flip=!b.flip;}

document.addEventListener('keydown',e=>{
  const tag=(e.target.tagName||'').toLowerCase();
  if(e.key==='Escape'){if(document.querySelector('.menu')){closeMenu();$('#btnExample').focus();return;}const d=document.querySelector('.dlg-back');if(d){d.remove();return;}sel.clear();selLine=null;render();return;}
  if(tag==='input'||tag==='textarea'||tag==='select'||document.querySelector('.dlg-back'))return;
  const mod=e.ctrlKey||e.metaKey;
  if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();deleteSelection();}
  else if(mod&&e.key.toLowerCase()==='z'){e.preventDefault();undo();}
  else if(mod&&e.key.toLowerCase()==='i'){e.preventDefault();flipSelection();}
  else if(mod&&e.key.toLowerCase()==='t'){e.preventDefault();run();}
  else if(mod&&e.key.toLowerCase()==='s'){e.preventDefault();saveFile();}
  else if(mod&&e.key.toLowerCase()==='a'){e.preventDefault();sel=new Set(model.blocks.map(b=>b.id));render();}
  else if(e.key===' '){e.preventDefault();fitView();}
  else if(e.key==='Enter'&&sel.size===1){e.preventDefault();openBlock([...sel][0]);}
});

function dialog(title,bodyHtml,{onOk,okLabel='OK',apply=false,cancel=true}={}){
  const back=document.createElement('div');back.className='dlg-back';
  back.innerHTML=`<div class="dlg" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="dlg-title">${esc(title)}</div><div class="dlg-body">${bodyHtml}</div>
    <div class="dlg-actions">${cancel?'<button class="btn" data-act="cancel">Cancel</button>':''}${apply?'<button class="btn" data-act="apply">Apply</button>':''}<button class="btn primary" data-act="ok">${esc(okLabel)}</button></div></div>`;
  $('#app').appendChild(back);
  const first=back.querySelector('input,select,textarea,.btn.primary');if(first)setTimeout(()=>first.focus(),0);
  back.addEventListener('click',e=>{
    const a=e.target.closest('[data-act]');if(e.target===back){back.remove();return;}if(!a)return;
    if(a.dataset.act==='cancel'){back.remove();return;}
    if(onOk){const ok=onOk(back,a.dataset.act==='apply');if(ok===false)return;}
    if(a.dataset.act==='ok')back.remove();
  });
  back.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName!=='TEXTAREA'){e.preventDefault();back.querySelector('[data-act="ok"]').click();}});
  return back;
}

// Scope navigation: the wheel zooms around the pointer (over the time axis only time, over the value axis only
// values), a left drag pans, and a double-click returns to the whole signal. w.view is null when fitted.
function scopeNav(w){
  const c=w.canvas;
  const pos=e=>{const r=c.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};};
  const cur=()=>w.view||w.full;
  c.addEventListener('wheel',e=>{
    const a=w.area;if(!a||!w.full)return;e.preventDefault();
    const {x,y}=pos(e),v={...cur()},f=Math.pow(1.0015,e.deltaY*(e.deltaMode===1?33:1));
    const inX=x>=a.L,inY=y<=a.T+a.ph;   // left of the plot: values only; below it: time only
    const fx=Math.min(1,Math.max(0,(x-a.L)/a.pw)),fy=Math.min(1,Math.max(0,1-(y-a.T)/a.ph));
    const F=w.full,minT=(F.t1-F.t0)*1e-6||1e-9,minY=(F.y1-F.y0)*1e-6||1e-9;
    if(inX){const tc=v.t0+fx*(v.t1-v.t0),sp=Math.max(minT,(v.t1-v.t0)*f);v.t0=tc-fx*sp;v.t1=v.t0+sp;}
    if(inY){const yc=v.y0+fy*(v.y1-v.y0),sp=Math.max(minY,(v.y1-v.y0)*f);v.y0=yc-fy*sp;v.y1=v.y0+sp;}

  },{passive:false});

    if(e.button!==0||!w.area||!w.full)return;c.setPointerCapture(e.pointerId);c.classList.add('pan');

    const up=()=>{c.classList.remove('pan');c.removeEventListener('pointermove',mv);c.removeEventListener('pointerup',up);c.removeEventListener('pointercancel',up);};
    c.addEventListener('pointermove',mv);c.addEventListener('pointerup',up);c.addEventListener('pointercancel',up);
  });
  c.addEventListener('pointermove',e=>{if(c.classList.contains('pan'))return;w.hover=pos(e).x;drawScope(w);});
  c.addEventListener('pointerleave',()=>{w.hover=null;drawScope(w);});
  c.addEventListener('dblclick',()=>{w.view=null;drawScope(w);});
}
function niceTicks(a,b,n){
  const span=b-a||1,raw=span/n,p=Math.pow(10,Math.floor(Math.log10(raw))),f=raw/p;

  return out;
}

    data.labels.forEach((lab,k)=>{const tw=g.measureText(lab).width;if(k&&lx+30+tw>W-R){return;}g.strokeStyle='#000000';g.lineWidth=1.6;g.setLineDash(SCOPE_DASH[k%SCOPE_DASH.length]);g.beginPath();g.moveTo(lx,ly);g.lineTo(lx+24,ly);g.stroke();g.setLineDash([]);g.fillStyle='#111111';g.fillText(lab,lx+30,ly);lx+=30+tw+18;});}

    data.ys.forEach((ys,k)=>{g.fillStyle='#ffffff';g.strokeStyle='#000000';g.lineWidth=1.4;g.beginPath();g.arc(X(t[i]),Y(ys[i]),3.2,0,7);g.fill();g.stroke();});g.restore();

function parseMx(buf){
  const dv=new DataView(buf),len=buf.byteLength;
  const el=off=>{let type=dv.getUint32(off,true);if(type>>>16){const n=type>>>16;return{type:type&0xffff,n,data:off+4,next:off+8};}
    const n=dv.getUint32(off+4,true);return{type,n,data:off+8,next:off+8+Math.ceil(n/8)*8};};
  const SZ={1:1,2:1,3:2,4:2,5:4,6:4,7:4,9:8,12:8,13:8};
  const nums=e=>{const sz=SZ[e.type],out=[];if(!sz)return out;for(let i=0;i<e.n/sz;i++){const o=e.data+i*sz;
    out.push(e.type===9?dv.getFloat64(o,true):e.type===7?dv.getFloat32(o,true):e.type===1?dv.getInt8(o):e.type===2?dv.getUint8(o):e.type===3?dv.getInt16(o,true):e.type===4?dv.getUint16(o,true):e.type===5?dv.getInt32(o,true):e.type===6?dv.getUint32(o,true):e.type===12?Number(dv.getBigInt64(o,true)):Number(dv.getBigUint64(o,true)));}return out;};
  const matrix=e=>{
    let p=e.data;const fl=el(p);const cls=dv.getUint32(fl.data,true)&0xff;p=fl.next;
    const dm=el(p);p=dm.next;const nm=el(p);p=nm.next;
    if(cls===2){const fln=el(p);const flen=nums(fln)[0];p=fln.next;const fn=el(p);p=fn.next;const names=[];
      for(let i=0;i<fn.n/flen;i++){let s='';for(let j=0;j<flen;j++){const ch=dv.getUint8(fn.data+i*flen+j);if(!ch)break;s+=String.fromCharCode(ch);}names.push(s);}
      const res={};for(const name of names){const sub=el(p);p=sub.next;if(sub.type===14&&sub.n>0){try{res[name]=matrix(sub);}catch(_){}}}return{struct:res};}
    if(cls>=6&&cls<=15){const re=el(p);return{num:nums(re)};}
    return{};
  };
  for(let off=0;off<Math.min(len-8,64);off+=4){
    if(dv.getUint32(off,true)===14){try{const m=matrix(el(off));if(m.struct){const vars={};for(const [k,v] of Object.entries(m.struct))if(v.num&&v.num.length)vars[k]=v.num.length===1?v.num[0]:v.num;return vars;}}catch(_){}}
  }
  return{};
}
function mapSlxBlock(bt,P){
  const pick=(type,keys,rename)=>{const p={...BLOCKS[type].def};for(const k of keys){const src=(rename&&rename[k])||k;if(P[src]!=null&&P[src]!=='')p[k]=P[src];}return{type,p};};
  switch(bt){
    case 'Constant':return pick('Constant',['Value']);
    case 'Step':return pick('Step',['Time','Before','After']);
    case 'Sin':return pick('Sine',['Amplitude','Bias','Frequency','Phase']);
    case 'Clock':return{type:'Clock',p:{}};
    case 'DiscretePulseGenerator':return pick('Pulse',['Amplitude','Period','PulseWidth','PhaseDelay']);
    case 'Scope':return pick('Scope',['NumInputPorts']);
    case 'Display':{const r=pick('Display',['Format']);if(r.p.Format!=='long')r.p.Format='short';return r;}
    case 'Integrator':return pick('Integrator',['InitialCondition']);
    case 'Derivative':return{type:'Derivative',p:{}};
    case 'TransferFcn':return pick('TransferFcn',['Numerator','Denominator']);
    case 'TransportDelay':return pick('TransportDelay',['DelayTime','InitialOutput']);
    case 'Gain':return pick('Gain',['Gain']);
    case 'Sum':return pick('Sum',['Inputs']);
    case 'Product':return pick('Product',['Inputs']);
    case 'Abs':return{type:'Abs',p:{}};
    case 'Saturate':return pick('Saturation',['UpperLimit','LowerLimit']);
    case 'DeadZone':return pick('DeadZone',['LowerValue','UpperValue'],{LowerValue:'LowerValue',UpperValue:'UpperValue'});
    case 'Relay':return pick('Relay',['OnSwitchValue','OffSwitchValue','OnOutputValue','OffOutputValue']);
    case 'UnitDelay':return pick('UnitDelay',['InitialCondition','SampleTime'],{InitialCondition:P.InitialCondition!=null?'InitialCondition':'X0'});
    case 'ZeroOrderHold':return pick('ZOH',['SampleTime']);
    case 'Switch':return pick('Switch',['Criteria','Threshold']);
    case 'Fcn':{const r=pick('Fcn',['Expr']);r.p.Expr=r.p.Expr.replace(/u\s*\(\s*1\s*\)/g,'u');return r;}
    case 'Reference':{
      const src=(P.SourceBlock||'')+' '+(P.SourceType||'');
      if(/PID 1dof|PID Controller/.test(src)){const r=pick('PID',['Controller','Form','P','I','D','N','LimitOutput','UpperSaturationLimit','LowerSaturationLimit','AntiWindupMode']);
        if(r.p.AntiWindupMode!=='clamping')r.p.AntiWindupMode='none';return r;}
      if(/Ramp/.test(src))return pick('Ramp',['slope','start','InitialOutput'],{InitialOutput:'X0'});
      break;
    }
  }
  const pr=(P.Ports||'[]').replace(/[\[\]]/g,'').split(/[,\s]+/).filter(Boolean).map(Number);
  return{type:'Unknown',p:{BlockType:bt==='Reference'?(P.SourceType||P.SourceBlock||'Reference'):bt},ports:[pr[0]||0,Math.min(pr[1]||0,4)]};
}
// Reads all three Simulink storage layouts:
//  - .slx from recent releases: simulink/systems/system_root.xml, lines connected by block SID
//  - .slx from older releases: whole diagram in simulink/blockdiagram.xml, lines connected by block name
//  - .mdl text files: converted to the same XML shape first
function buildFromSystem(root,vars,cfgText,fileName){
  const kids=(el,tag)=>Array.from(el.children).filter(c=>c.tagName===tag);
  const directP=el=>{const m={};for(const p of kids(el,'P')){const k=p.getAttribute('Name');if(!(k in m))m[k]=p.textContent;}return m;};
  const pmap=el=>{const m=directP(el);for(const p of el.getElementsByTagName('P')){const k=p.getAttribute('Name');if(!(k in m))m[k]=p.textContent;}return m;};
  const m=emptyModel();const sid=new Map(),byName=new Map();const unknown=[];
  for(const el of kids(root,'Block')){
    const P=pmap(el),D=directP(el);
    const bt=el.getAttribute('BlockType')||D.BlockType||'Unknown',name=el.getAttribute('Name')||D.Name||bt;
    const pos=(P.Position||'[0, 0, 40, 40]').replace(/[\[\]]/g,'').split(/[,;\s]+/).filter(Boolean).map(Number);
    const [l,t,r,bb]=pos;let w=Math.max(16,(r-l)||40),h=Math.max(16,(bb-t)||40);
    const mm=mapSlxBlock(bt,P);
    if(mm.type==='Unknown')unknown.push(name.replace(/\s+/g,' '));
    const b={id:uid(),type:mm.type,name,x:l||0,y:t||0,w,h,p:mm.p,flip:P.BlockMirror==='on'||P.Orientation==='left'};
    if(mm.ports)b.ports=mm.ports;
    if(b.type==='Sum'){const d=Math.max(20,Math.min(w,h));b.w=b.h=d;}
    m.blocks.push(b);const sv=el.getAttribute('SID')||D.SID;if(sv)sid.set(String(sv).trim(),b.id);byName.set(name,b.id);
  }
  const seen=new Set();for(const b of m.blocks){let n=b.name,i=1;while(seen.has(n))n=b.name+'_'+(i++);b.name=n;seen.add(n);}
  const parseEnd=s=>{const r=/^\s*(\d+)#(in|out):(\d+)\s*$/.exec(s||'');return r?{sid:r[1],kind:r[2],port:+r[3]-1}:null;};
  let skipped=0;
  const srcOf=P=>{
    if(P.Src!=null){const r=parseEnd(P.Src);return r&&r.kind==='out'&&sid.has(r.sid)?{b:sid.get(r.sid),port:r.port}:null;}
    if(P.SrcBlock!=null){const id=byName.get(P.SrcBlock),pt=parseInt(P.SrcPort,10);return id&&pt>0?{b:id,port:pt-1}:null;}
    return null;};
  const dstOf=P=>{
    if(P.Dst!=null){const r=parseEnd(P.Dst);return r&&r.kind==='in'&&sid.has(r.sid)?{b:sid.get(r.sid),port:r.port}:undefined;}
    if(P.DstBlock!=null){const id=byName.get(P.DstBlock),pt=parseInt(P.DstPort,10);return id&&pt>0?{b:id,port:pt-1}:undefined;}
    return null;};
  for(const ln of kids(root,'Line')){
    const src=srcOf(directP(ln));if(!src){skipped++;continue;}
    for(const el of [ln,...ln.getElementsByTagName('Branch')]){
      const d=dstOf(directP(el));if(d===null)continue;if(!d){skipped++;continue;}
      m.lines.push({id:uid('l'),src:{...src},dst:d});}
  }
  const used=new Set();
  for(const b of m.blocks){const d=BLOCKS[b.type];for(const f of d.fields||[]){if(f.opts||f.raw)continue;
    try{const toks=tokenize(String(b.p[f.k]??''));toks.forEach((tk,i)=>{if(tk.k==='id'&&!(tk.v in FUNCS&&toks[i+1]&&toks[i+1].v==='(')&&!(tk.v in CONSTS)&&!(f.expr&&(tk.v==='u'||tk.v==='t')))used.add(tk.v);});}catch(e){}}}
  const missing=[...used].filter(v=>!(v in vars));
  const fmt=v=>Array.isArray(v)?'['+v.map(x=>+x.toPrecision(12)).join(' ')+']':String(+(+v).toPrecision(12));
  m.settings.ws=Object.entries(vars).map(([k,v])=>`${k} = ${fmt(v)};`).concat(missing.map(k=>`${k} = 1;   % value not found in the model file, please check`)).join('\n');
  if(cfgText){const st=/<P Name="StopTime"[^>]*>([^<]*)</.exec(cfgText)||/^\s*StopTime\s+"([^"]*)"/m.exec(cfgText);if(st&&st[1].trim())m.settings.stop=st[1].trim();}
  m.settings.name=String(fileName||'model').replace(/\.(slx|mdl)$/i,'');
  if(m.blocks.length){const mxn=Math.min(...m.blocks.map(b=>b.x)),myn=Math.min(...m.blocks.map(b=>b.y));for(const b of m.blocks){b.x+=40-mxn;b.y+=40-myn;}}
  return{model:m,unknown,missing,vars:Object.keys(vars),skipped};
}
const parseXml=t=>{const d=new DOMParser().parseFromString(t,'application/xml');if(d.getElementsByTagName('parsererror').length)throw new Error('The model XML inside this file could not be read.');return d;};
async function importSlx(file){
  if(typeof JSZip==='undefined')throw new Error('The ZIP reader didn’t load. Check your connection and reload the page.');
  let zip;try{zip=await JSZip.loadAsync(file);}catch(e){throw new Error('Can’t read this file: it isn’t a valid .slx (ZIP) file.');}
  let root,cfgText=null;
  const sf=zip.file('simulink/systems/system_root.xml');
  if(sf){root=parseXml(await sf.async('string')).documentElement;const cfg=zip.file('simulink/configSet0.xml');if(cfg)cfgText=await cfg.async('string');}
  else{
    const bd=zip.file('simulink/blockdiagram.xml');
    if(!bd)throw new Error('No Simulink model was found inside this file. It may be a library or a protected model.');
    const txt=await bd.async('string');root=parseXml(txt).getElementsByTagName('System')[0];cfgText=txt;
    if(!root)throw new Error('This .slx file contains no block diagram.');
  }
  let vars={};const mx=zip.file('simulink/modelWorkspace.mxarray');
  if(mx){try{vars=parseMx(await mx.async('arraybuffer'));}catch(e){vars={};}}
  return buildFromSystem(root,vars,cfgText,file.name);
}
function mdlToXml(text){
  const xe=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const unq=v=>{v=v.trim();if(!v.startsWith('"'))return v;let out='';const re=/"((?:[^"\\]|\\.)*)"/g;let mm;while((mm=re.exec(v)))out+=mm[1];
    return out.replace(/\\n/g,'\n').replace(/\\t/g,'\t').replace(/\\"/g,'"').replace(/\\\\/g,'\\');};
  const KEEP=new Set(['Model','System','Block','Line','Branch']);
  const lines=text.split(/\r?\n/);const out=[],stack=[];let i=0;
  while(i<lines.length){
    const line=lines[i++].trim();
    if(!line||line.startsWith('#'))continue;
    if(line.startsWith('__MWOPC'))break;
    if(line==='}'){if(stack.length)out.push(`</${stack.pop()}>`);continue;}
    let m=/^([A-Za-z_]\w*)\s*\{$/.exec(line);
    if(m){const tag=KEEP.has(m[1])?m[1]:'Sec';stack.push(tag);out.push(tag==='Sec'?`<Sec Name="${xe(m[1])}">`:`<${tag}>`);continue;}
    m=/^([A-Za-z_]\w*)\s+([\s\S]*)$/.exec(line);if(!m)continue;
    let val=m[2];
    if(val.trim().startsWith('"'))while(i<lines.length&&/^\s*"/.test(lines[i]))val+=lines[i++].trim();
    out.push(`<P Name="${xe(m[1])}">${xe(unq(val))}</P>`);
  }
  while(stack.length)out.push(`</${stack.pop()}>`);
  return '<Root>'+out.join('')+'</Root>';
}
async function importMdl(file){
  const text=await file.text();
  // Newer .mdl files can carry the diagram as an embedded XML part
  const part=/__MWOPC_PART_BEGIN__\s+\/simulink\/systems\/system_root\.xml\s*\r?\n([\s\S]*?)(?=\r?\n__MWOPC_)/.exec(text);
  let root;
  if(part)root=parseXml(part[1].trim()).documentElement;
  else{const doc=parseXml(mdlToXml(text));root=doc.getElementsByTagName('System')[0];}
  if(!root||!root.children.length)throw new Error('No block diagram was found in this .mdl file.');
  return buildFromSystem(root,{},text,file.name);
}
async function openFile(file){
  if(!file)return;
  setStatus(`Reading “${file.name}”…`);
  try{
    if(/\.json$/i.test(file.name)){
      let obj;try{obj=JSON.parse(await file.text());}catch(e){throw new Error(`“${file.name}” isn’t valid JSON.`);}
      const m=obj&&obj.format==='simuwire'?obj.model:obj;
      if(!m||!Array.isArray(m.blocks)||!Array.isArray(m.lines))throw new Error(`“${file.name}” isn’t a Simuwire model file.`);
      for(const b of m.blocks){if(!BLOCKS[b.type]){b.p={BlockType:String(b.type)};b.type='Unknown';}b.p=b.p||{};}
      m.settings=Object.assign(emptyModel().settings,m.settings||{});
      if(!m.settings.name||m.settings.name==='untitled')m.settings.name=file.name.replace(/(\.simuwire)?\.json$/i,'').replace(/_\d{4}-\d{2}-\d{2}_\d{4,6}$/,'');
      pushUndo();model=m;results=null;sel.clear();selLine=null;errIds=new Set(model.blocks.filter(b=>b.type==='Unknown').map(b=>b.id));
      for(const w of scopeWins.values())w.el.remove();scopeWins.clear();
      syncStop();save();render();fitView();
      setStatus(`Opened “${file.name}”: ${model.blocks.length} blocks, ${model.lines.length} connections.`,'ok');
      return;
    }
    const r=/\.mdl$/i.test(file.name)?await importMdl(file):await importSlx(file);
    pushUndo();model=r.model;results=null;sel.clear();selLine=null;errIds=new Set(model.blocks.filter(b=>b.type==='Unknown').map(b=>b.id));
    for(const w of scopeWins.values())w.el.remove();scopeWins.clear();
    syncStop();save();render();fitView();
    const parts=[`Opened “${file.name}”: ${model.blocks.length} blocks, ${model.lines.length} connections.`];
    if(r.vars.length)parts.push(`Model variables loaded: ${r.vars.join(', ')}.`);
    if(r.missing.length)parts.push(`Variables without a value were set to 1: ${r.missing.join(', ')} (fix them in Settings).`);
    if(r.unknown.length)parts.push(`Unsupported blocks: ${r.unknown.join(', ')}.`);
    setStatus(parts.join(' '),r.unknown.length||r.missing.length?'warn':'ok');
  }catch(e){setStatus(e.message,'err');}
}

function loadModelObject(m,label){
  pushUndo();model=JSON.parse(JSON.stringify(m));model.settings=Object.assign(emptyModel().settings,model.settings||{});
  results=null;sel.clear();selLine=null;errIds.clear();for(const w of scopeWins.values())w.el.remove();scopeWins.clear();
  syncStop();save();render();fitView();setStatus(`Loaded example “${label}”. Press Run, or change its parameters under Settings.`,'ok');
}
function menuOutside(e){if(!e.target.closest('.menu')&&!e.target.closest('#btnExample'))closeMenu();}
function closeMenu(){const m=document.querySelector('.menu');if(m)m.remove();document.removeEventListener('pointerdown',menuOutside);$('#btnExample').setAttribute('aria-expanded','false');}
function openExamplesMenu(){
  closeMenu();const btn=$('#btnExample'),r=btn.getBoundingClientRect(),ar=$('#app').getBoundingClientRect();
  const m=document.createElement('div');m.className='menu';m.setAttribute('role','menu');m.setAttribute('aria-label','Example models');
  let html='',g=null;
  EXAMPLES.forEach((ex,i)=>{if(ex.g!==g){g=ex.g;html+=`<div class="menu-group">${esc(g)}</div>`;}
    html+=`<button class="menu-item" role="menuitem" data-ex="${i}"><b>${esc(ex.t)}</b><span>${esc(ex.d)}</span></button>`;});
  m.innerHTML=html;$('#app').appendChild(m);
  m.style.left=Math.max(4,Math.min(r.left-ar.left,ar.width-m.offsetWidth-4))+'px';m.style.top=(r.bottom-ar.top+4)+'px';
  m.addEventListener('click',e=>{const it=e.target.closest('[data-ex]');if(!it)return;const ex=EXAMPLES[+it.dataset.ex];closeMenu();loadModelObject(ex.m,ex.t);});
  m.addEventListener('keydown',e=>{const items=[...m.querySelectorAll('.menu-item')];const k=items.indexOf(document.activeElement);
    if(e.key==='ArrowDown'){e.preventDefault();items[(k+1)%items.length].focus();}
    else if(e.key==='ArrowUp'){e.preventDefault();items[(k-1+items.length)%items.length].focus();}});
  setTimeout(()=>document.addEventListener('pointerdown',menuOutside),0);
  btn.setAttribute('aria-expanded','true');m.querySelector('.menu-item').focus();
}
$('#btnExample').onclick=()=>{if(document.querySelector('.menu'))closeMenu();else openExamplesMenu();};
$('#btnNew').onclick=()=>{pushUndo();model=emptyModel();results=null;sel.clear();selLine=null;errIds.clear();for(const w of scopeWins.values())w.el.remove();scopeWins.clear();syncStop();save();render();fitView();setStatus('New model. Use Undo to get the previous one back.');};
$('#empty').addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(!a)return;if(a.dataset.act==='open')openPicker();else openExamplesMenu();});
const wrap=$('#wrap');
wrap.addEventListener('dragover',e=>{e.preventDefault();});
wrap.addEventListener('drop',e=>{e.preventDefault();const f=e.dataTransfer.files&&e.dataTransfer.files[0];if(f)openFile(f);});
new ResizeObserver(()=>{}).observe(svg);

// Resizable library panel (width remembered in this browser)
(function(){
  const LIBW_KEY='simuwire:libw',MIN=160,MAX=520,DEF=250;
  const main=document.querySelector('.main'),h=$('#libResize');
  const setW=w=>{w=Math.round(Math.max(MIN,Math.min(MAX,Math.min(w,innerWidth-260))));main.style.setProperty('--libw',w+'px');h.setAttribute('aria-valuenow',w);return w;};
  const store=w=>{try{localStorage.setItem(LIBW_KEY,String(w));}catch(e){}};
  let cur=DEF;try{const v=parseInt(localStorage.getItem(LIBW_KEY),10);if(v)cur=v;}catch(e){}
  cur=setW(cur);
  h.addEventListener('pointerdown',e=>{
    e.preventDefault();h.setPointerCapture(e.pointerId);h.classList.add('active');document.body.classList.add('resizing');
    const x0=e.clientX,w0=cur;
    const mv=ev=>{cur=setW(w0+ev.clientX-x0);};
    const up=()=>{h.removeEventListener('pointermove',mv);h.removeEventListener('pointerup',up);h.removeEventListener('pointercancel',up);
      h.classList.remove('active');document.body.classList.remove('resizing');store(cur);};
    h.addEventListener('pointermove',mv);h.addEventListener('pointerup',up);h.addEventListener('pointercancel',up);
  });
  h.addEventListener('dblclick',()=>{cur=setW(DEF);store(cur);});
  h.addEventListener('keydown',e=>{
    if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();cur=setW(cur+(e.key==='ArrowRight'?20:-20));store(cur);}
  });
})();

model=load()||exampleModel();
buildLibrary();syncStop();render();
requestAnimationFrame(fitView);
setStatus(model.blocks.length?'Ready. Press Run to simulate, or Open to load a saved model or an .slx file.':'Ready.');
</script>
